plugins { id 'com.android.application' }
android {
    namespace 'com.bric.cheatgame'
    compileSdk 35
    defaultConfig { applicationId 'com.bric.cheatgame'; minSdk 33; targetSdk 35; versionCode 12; versionName '1.0.11'; testInstrumentationRunner 'com.bric.cheatgame.VisionInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
tasks.withType(Test).configureEach { systemProperty 'java.library.path', '' }
